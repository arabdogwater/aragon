name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build Windows release
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Roblox tools (Rojo, Wally)
        uses: CompeyDev/setup-rokit@v0.2.1

      - name: Install plugin packages
        working-directory: plugin
        run: wally install

      - name: Build Aragon (plugin is embedded in the exe)
        env:
          ARAGON_REPO: ${{ github.repository }}
        run: cargo build --release --locked

      - name: Build standalone plugin
        run: rojo build plugin/default.project.json --output Aragon.rbxm

      - name: Package
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $name = "aragon-$version-windows-x86_64"
          New-Item -ItemType Directory -Force dist/$name | Out-Null
          Copy-Item target/release/aragon.exe, README.md, LICENSE.md, NOTICE dist/$name/
          Compress-Archive -Path dist/$name/* -DestinationPath dist/$name.zip -Force
          Copy-Item Aragon.rbxm dist/Aragon.rbxm
          Get-ChildItem dist -File | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content dist/SHA256SUMS.txt -Encoding ascii

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/Aragon.rbxm
            dist/SHA256SUMS.txt
